<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción Escolar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Prosecución de Educación Primaria</h1>
            <p>Registro de Inscripción</p>
        </header>

        <form action="https://formspree.io/f/TU_ID_AQUI" method="POST">
            
            <fieldset>
                <legend>Datos Académicos</legend>
                <div class="row">
                    <div class="input-group">
                        <label>Grado:</label>
                        <input type="text" name="grado" required>
                    </div>
                    <div class="input-group">
                        <label>Sección:</label>
                        <input type="text" name="seccion" required>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Datos del Estudiante</legend>
                <div class="row">
                    <div class="input-group">
                        <label>Nombres:</label>
                        <input type="text" name="nombres" required>
                    </div>
                    <div class="input-group">
                        <label>Apellidos:</label>
                        <input type="text" name="apellidos" required>
                    </div>
                </div>
                <div class="row">
                    <div class="input-group">
                        <label>Cédula:</label>
                        <input type="text" name="cedula">
                    </div>
                    <div class="input-group">
                        <label>Dirección:</label>
                        <input type="text" name="direccion" required>
                    </div>
                </div>
            </fieldset>

            <button type="submit">REGISTRAR EN LA BASE DE DATOS</button>
        </form>
    </div>
</body>
</html>
